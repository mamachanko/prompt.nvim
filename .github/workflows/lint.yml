name: Lint
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stylua
        uses: taiki-e/install-action@v2
        with:
          tool: stylua
      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua-check
      - name: Run lint
        run: make lint
